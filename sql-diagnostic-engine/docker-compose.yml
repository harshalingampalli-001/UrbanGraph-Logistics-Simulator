services:
  postgres:
    image: postgres:15-alpine
    container_name: diagnostic-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: enterprisedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d enterprisedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: sql-diagnostic-dashboard
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/enterprisedb
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
